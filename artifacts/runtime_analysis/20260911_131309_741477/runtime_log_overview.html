.form-select:focus-visible {

.form-check {

.form-check-input {

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);

}

.form-check:not(.form-switch)

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);

}

.form-check:not(.form-switch)

  height: 100%;

.form-check-input[type=&quot;radio&quot;] {

}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {

  height: 20px;

}

  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  margin: 0;

}

  height: 28px;

}

}

.form-range:focus-visible::-moz-range-thumb {

  function interpolate(series, xValue, xKey, yKey) {
    const i = d3.bisector(d =&gt; d[xKey]).center(series, xValue);
    if (i &lt;= 0 || i &gt;= series.length - 1) return series[Math.max(0, Math.min(series.length-1, i))][yKey];
    const a = series[i-1], b = series[i];
    const t = (xValue-a[xKey]) / Math.max(1e-9, b[xKey]-a[xKey]);
    return a[yKey] + t * (b[yKey]-a[yKey]);
  }

    svg.append(&#x27;circle&#x27;).attr(&#x27;cx&#x27;,x(data.summary.maxLagElapsed)).attr(&#x27;cy&#x27;,y(data.summary.maxLag)).attr(&#x27;r&#x27;,4).attr(&#x27;fill&#x27;,colors[3]);
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,x(data.summary.maxLagElapsed)-6).attr(&#x27;y&#x27;,y(data.summary.maxLag)-8).attr(&#x27;text-anchor&#x27;,&#x27;end&#x27;).text(`峰值 ${fmt1(data.summary.maxLag)} s`);

    svg.append(&#x27;rect&#x27;).attr(&#x27;data-chart-hit&#x27;,&#x27;true&#x27;).attr(&#x27;data-chart-hover-overlay&#x27;,&#x27;cross-series&#x27;).attr(&#x27;x&#x27;,m.left).attr(&#x27;y&#x27;,m.top).attr(&#x27;width&#x27;,width-m.left-m.right).attr(&#x27;height&#x27;,height-m.top-m.bottom).attr(&#x27;fill&#x27;,&#x27;transparent&#x27;)
      .on(&#x27;pointermove&#x27;,event=&gt;{const xv=Math.max(x.domain()[0],Math.min(x.domain()[1],x.invert(d3.pointer(event)[0]))); const value=interpolate(data.lag,xv,&#x27;elapsed_s&#x27;,&#x27;estimated_lag_s&#x27;); guide.attr(&#x27;x1&#x27;,x(xv)).attr(&#x27;x2&#x27;,x(xv)).attr(&#x27;opacity&#x27;,0.65); showTip(event,`时间 &lt;b&gt;${fmt2(xv)} s&lt;/b&gt;&lt;br&gt;估算积压 &lt;b&gt;${fmt2(value)} s&lt;/b&gt;`);})
      .on(&#x27;pointerleave&#x27;,()=&gt;{guide.attr(&#x27;opacity&#x27;,0);hideTip();});
  }

  function drawTime(){
    const {svg,width,height}=setup(&#x27;runtime-time-chart&#x27;,250,&#x27;主循环总时间中事件处理占 56.1%，等待事件占 41.1%，写日志占 2.7%&#x27;);
    const m={top:44,right:18,bottom:52,left:18}; const total=d3.sum(data.time,d=&gt;d.seconds); let cursor=m.left;
    const usable=width-m.left-m.right;
    data.time.forEach((d,i)=&gt;{const w=usable*d.seconds/total; svg.append(&#x27;rect&#x27;).attr(&#x27;x&#x27;,cursor).attr(&#x27;y&#x27;,86).attr(&#x27;width&#x27;,Math.max(0,w)).attr(&#x27;height&#x27;,44).attr(&#x27;fill&#x27;,colors[i%colors.length]); if(w&gt;42){svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,cursor+w/2).attr(&#x27;y&#x27;,112).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(`${fmt1(d.seconds/total*100)}%`);} cursor+=w;});
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,m.left).attr(&#x27;y&#x27;,32).text(`总循环时间 ${fmt1(total)} s`);
    let lx=m.left, ly=168;
    data.time.forEach((d,i)=&gt;{const label=`${d.name} ${fmt2(d.seconds)} s`; const approx=label.length*13+34; if(lx+approx&gt;width-m.right){lx=m.left;ly+=28;} svg.append(&#x27;rect&#x27;).attr(&#x27;x&#x27;,lx).attr(&#x27;y&#x27;,ly-10).attr(&#x27;width&#x27;,16).attr(&#x27;height&#x27;,8).attr(&#x27;fill&#x27;,colors[i%colors.length]); svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,lx+22).attr(&#x27;y&#x27;,ly).text(label); lx+=approx;});
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,width/2).attr(&#x27;y&#x27;,height-8).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;事件处理 56.1% 是主瓶颈；写日志仅 2.7%&#x27;);
  }

  function drawLatency(){
    const {svg,width,height}=setup(&#x27;runtime-latency-chart&#x27;,280,&#x27;无候选、full 候选、upper 候选和最终输出的检测耗时中位数与 P95&#x27;);
    const m={top:20,right:24,bottom:70,left:64};
    const x=d3.scaleBand().domain(data.latency.map(d=&gt;d.name)).range([m.left,width-m.right]).padding(0.34);
    const y=d3.scaleLinear().domain([0,d3.max(data.latency,d=&gt;d.p95)*1.18]).nice().range([height-m.bottom,m.top]);

    svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-axis&#x27;).attr(&#x27;transform&#x27;,`translate(0,${height-m.bottom})`).call(d3.axisBottom(x)); svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-axis&#x27;).attr(&#x27;transform&#x27;,`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(5));

    data.latency.forEach((d,i)=&gt;{const cx=x(d.name)+x.bandwidth()/2; svg.append(&#x27;line&#x27;).attr(&#x27;x1&#x27;,cx).attr(&#x27;x2&#x27;,cx).attr(&#x27;y1&#x27;,y(d.p50)).attr(&#x27;y2&#x27;,y(d.p95)).attr(&#x27;stroke&#x27;,colors[i%colors.length]).attr(&#x27;stroke-width&#x27;,3); svg.append(&#x27;circle&#x27;).attr(&#x27;cx&#x27;,cx).attr(&#x27;cy&#x27;,y(d.p50)).attr(&#x27;r&#x27;,5).attr(&#x27;fill&#x27;,colors[i%colors.length]); svg.append(&#x27;path&#x27;).attr(&#x27;d&#x27;,d3.symbol().type(d3.symbolDiamond).size(90)()).attr(&#x27;transform&#x27;,`translate(${cx},${y(d.p95)})`).attr(&#x27;fill&#x27;,colors[i%colors.length]); svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,cx).attr(&#x27;y&#x27;,y(d.p95)-10).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(`${fmt2(d.p50)} / ${fmt2(d.p95)}`);});
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,width/2).attr(&#x27;y&#x27;,height-8).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;圆点：P50，菱形：P95；标注为 P50 / P95&#x27;);
  }

  function drawFunnel(){
    const {svg,width,height}=setup(&#x27;runtime-funnel-chart&#x27;,300,&#x27;full 与 upper 模式从候选、几何通过、置信度通过到最终输出的数量&#x27;);
    const m={top:18,right:42,bottom:48,left:92}; const stages=data.funnel.stages;
    const y=d3.scaleBand().domain(stages).range([m.top,height-m.bottom]).padding(0.24);
    const x=d3.scaleLog().domain([0.7,5000]).range([m.left,width-m.right]);
    frame(svg,m,width,height); svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-axis&#x27;).attr(&#x27;transform&#x27;,`translate(0,${height-m.bottom})`).call(d3.axisBottom(x).tickValues([1,10,100,1000]).tickFormat(d3.format(&#x27;~s&#x27;))); svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-axis&#x27;).attr(&#x27;transform&#x27;,`translate(${m.left},0)`).call(d3.axisLeft(y));
    stages.forEach((stage,i)=&gt;{const vals=[{name:&#x27;full&#x27;,value:data.funnel.full[i],color:colors[0],offset:0.12},{name:&#x27;upper&#x27;,value:data.funnel.upper[i],color:colors[1],offset:0.58}]; vals.forEach(v=&gt;{const yy=y(stage)+y.bandwidth()*v.offset; const h=y.bandwidth()*0.3; const end=x(Math.max(0.7,v.value)); svg.append(&#x27;line&#x27;).attr(&#x27;x1&#x27;,m.left).attr(&#x27;x2&#x27;,end).attr(&#x27;y1&#x27;,yy+h/2).attr(&#x27;y2&#x27;,yy+h/2).attr(&#x27;stroke&#x27;,v.color).attr(&#x27;stroke-width&#x27;,h); svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,Math.min(width-m.right+4,end+5)).attr(&#x27;y&#x27;,yy+h/2+4).text(`${v.name} ${fmt0(v.value)}`);});});
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,width/2).attr(&#x27;y&#x27;,height-6).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;数量（对数刻度）&#x27;);
  }

  const confidenceVisible={full:true,upper:true};
  function drawConfidence(){
    const {svg,width,height}=setup(&#x27;runtime-confidence-chart&#x27;,260,&#x27;full 与 upper 候选的 xiaoiron_confidence 分布以及 0.3 阈值&#x27;);
    const m={top:12,right:24,bottom:46,left:64}; const all=[...data.confidence.full,...data.confidence.upper];
    const x=d3.scaleLinear().domain([0,0.56]).range([m.left,width-m.right]); const y=d3.scaleSqrt().domain([0,d3.max(all,d=&gt;d.count)]).nice().range([height-m.bottom,m.top]);
    frame(svg,m,width,height); axes(svg,x,y,m,width,height,&#x27;xiaoiron_confidence&#x27;,&#x27;候选数（平方根刻度）&#x27;,6,5);
    [[&#x27;full&#x27;,data.confidence.full,colors[0]],[&#x27;upper&#x27;,data.confidence.upper,colors[1]]].forEach(([name,series,color])=&gt;{if(!confidenceVisible[name])return; const line=d3.line().curve(d3.curveStepAfter).x(d=&gt;x(d.x)).y(d=&gt;y(d.count)); svg.append(&#x27;path&#x27;).datum(series).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,color).attr(&#x27;stroke-width&#x27;,2).attr(&#x27;d&#x27;,line);});
    svg.append(&#x27;line&#x27;).attr(&#x27;x1&#x27;,x(0.3)).attr(&#x27;x2&#x27;,x(0.3)).attr(&#x27;y1&#x27;,m.top).attr(&#x27;y2&#x27;,height-m.bottom).attr(&#x27;stroke&#x27;,colors[3]).attr(&#x27;stroke-width&#x27;,1.5).attr(&#x27;stroke-dasharray&#x27;,&#x27;5 4&#x27;);
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,x(0.3)+5).attr(&#x27;y&#x27;,m.top+13).text(&#x27;阈值 0.30&#x27;);
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,x(0.2204)-3).attr(&#x27;y&#x27;,m.top+31).attr(&#x27;text-anchor&#x27;,&#x27;end&#x27;).text(&#x27;upper 最大值 0.220&#x27;);
  }

  function drawSector(){
    const {svg,width,height}=setup(&#x27;runtime-sector-chart&#x27;,280,&#x27;方向扇区 1、2、5、6 中 q 等于 0 的候选比例，扇区 5 最高&#x27;);
    const m={top:18,right:24,bottom:48,left:64}; const x=d3.scaleBand().domain(data.sectors.map(d=&gt;d.sector)).range([m.left,width-m.right]).padding(0.38); const y=d3.scaleLinear().domain([0,50]).range([height-m.bottom,m.top]);
    frame(svg,m,width,height); axes(svg,x,y,m,width,height,&#x27;方向扇区&#x27;,&#x27;q=0 的候选比例 (%)&#x27;,4,5);
    data.sectors.forEach((d,i)=&gt;{svg.append(&#x27;rect&#x27;).attr(&#x27;x&#x27;,x(d.sector)).attr(&#x27;y&#x27;,y(d.zero_pct)).attr(&#x27;width&#x27;,x.bandwidth()).attr(&#x27;height&#x27;,y(0)-y(d.zero_pct)).attr(&#x27;fill&#x27;,i===2?colors[3]:colors[0]); svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,x(d.sector)+x.bandwidth()/2).attr(&#x27;y&#x27;,y(d.zero_pct)-7).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(`${fmt1(d.zero_pct)}%`);});
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,width/2).attr(&#x27;y&#x27;,height-7).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;R 取四扇区最小值，任一扇区缺失都会把整体证据压到 0&#x27;);
  }

  function drawThreshold(){
    const {svg,width,height}=setup(&#x27;runtime-threshold-chart&#x27;,280,&#x27;不同置信度阈值下，几何通过候选中 full 与 upper 模式剩余数量&#x27;); const m={top:18,right:58,bottom:48,left:64};
    const x=d3.scaleLinear().domain([0.1,0.3]).range([m.left,width-m.right]); const y=d3.scaleSqrt().domain([0,d3.max(data.thresholds,d=&gt;Math.max(d.full,d.upper))]).nice().range([height-m.bottom,m.top]);
    frame(svg,m,width,height); axes(svg,x,y,m,width,height,&#x27;置信度阈值&#x27;,&#x27;通过数量（平方根刻度）&#x27;,5,5);
    [[&#x27;full&#x27;,colors[0]],[&#x27;upper&#x27;,colors[1]]].forEach(([key,color])=&gt;{const line=d3.line().x(d=&gt;x(d.threshold)).y(d=&gt;y(d[key])); svg.append(&#x27;path&#x27;).datum(data.thresholds).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,color).attr(&#x27;stroke-width&#x27;,2).attr(&#x27;d&#x27;,line); svg.selectAll(`.threshold-${key}`).data(data.thresholds).enter().append(&#x27;circle&#x27;).attr(&#x27;cx&#x27;,d=&gt;x(d.threshold)).attr(&#x27;cy&#x27;,d=&gt;y(d[key])).attr(&#x27;r&#x27;,4).attr(&#x27;fill&#x27;,color); const last=data.thresholds[data.thresholds.length-1]; svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,x(last.threshold)+6).attr(&#x27;y&#x27;,y(last[key])+4).text(`${key} ${last[key]}`);});
  }

  function drawCenters(){
    const {svg,width,height}=setup(&#x27;runtime-center-chart&#x27;,410,&#x27;33 次最终输出在 128×128 像素平面中的位置，分成两个时间簇，并标出击球峰值圆&#x27;);
    const m={top:16,right:24,bottom:50,left:64}; const plot=Math.min(width-m.left-m.right,height-m.top-m.bottom); const left=m.left+(width-m.left-m.right-plot)/2;
    const x=d3.scaleLinear().domain([0,128]).range([left,left+plot]); const y=d3.scaleLinear().domain([0,128]).range([m.top,m.top+plot]);
    const local={left,top:m.top,right:width-left-plot,bottom:height-m.top-plot}; frame(svg,local,width,height);
    svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-gridline&#x27;).attr(&#x27;transform&#x27;,`translate(${left},0)`).call(d3.axisLeft(y).tickValues([0,32,64,96,128]).tickSize(-plot).tickFormat(&#x27;&#x27;));
    svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-gridline&#x27;).attr(&#x27;transform&#x27;,`translate(0,${m.top+plot})`).call(d3.axisBottom(x).tickValues([0,32,64,96,128]).tickSize(-plot).tickFormat(&#x27;&#x27;));
    svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-axis&#x27;).attr(&#x27;transform&#x27;,`translate(0,${m.top+plot})`).call(d3.axisBottom(x).tickValues([0,32,64,96,128])); svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-axis&#x27;).attr(&#x27;transform&#x27;,`translate(${left},0)`).call(d3.axisLeft(y).tickValues([0,32,64,96,128]));
    svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-axis-title&#x27;).attr(&#x27;data-axis&#x27;,&#x27;x&#x27;).attr(&#x27;x&#x27;,left+plot/2).attr(&#x27;y&#x27;,height-6).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;x (pixel)&#x27;);
    svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;,&#x27;runtime-axis-title&#x27;).attr(&#x27;data-axis&#x27;,&#x27;y&#x27;).attr(&#x27;transform&#x27;,&#x27;rotate(-90)&#x27;).attr(&#x27;x&#x27;,-(m.top+plot/2)).attr(&#x27;y&#x27;,left-44).attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;).text(&#x27;y (pixel)&#x27;);
    data.clusters.forEach((d,i)=&gt;{svg.append(&#x27;circle&#x27;).attr(&#x27;cx&#x27;,x(d.cx)).attr(&#x27;cy&#x27;,y(d.cy)).attr(&#x27;r&#x27;,plot*d.radius/128).attr(&#x27;fill&#x27;,&#x27;none&#x27;).attr(&#x27;stroke&#x27;,colors[i]).attr(&#x27;stroke-width&#x27;,2).attr(&#x27;stroke-dasharray&#x27;,&#x27;6 4&#x27;); svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,x(d.cx)+8).attr(&#x27;y&#x27;,y(d.cy)-8).text(`簇 ${d.cluster}：${d.count} 次`);});
    data.accepted.forEach(d=&gt;{svg.append(&#x27;circle&#x27;).attr(&#x27;cx&#x27;,x(d.cx)).attr(&#x27;cy&#x27;,y(d.cy)).attr(&#x27;r&#x27;,4).attr(&#x27;fill&#x27;,colors[(d.cluster-1)%2]).attr(&#x27;opacity&#x27;,0.82); svg.append(&#x27;circle&#x27;).attr(&#x27;data-chart-hit&#x27;,&#x27;true&#x27;).attr(&#x27;cx&#x27;,x(d.cx)).attr(&#x27;cy&#x27;,y(d.cy)).attr(&#x27;r&#x27;,16).attr(&#x27;fill&#x27;,&#x27;transparent&#x27;).on(&#x27;pointermove&#x27;,event=&gt;showTip(event,`簇 ${d.cluster}&lt;br&gt;圆心 (${fmt2(d.cx)}, ${fmt2(d.cy)})&lt;br&gt;半径 ${fmt2(d.radius)} px&lt;br&gt;置信度 ${d.xiaoiron_confidence.toFixed(3)}`)).on(&#x27;pointerleave&#x27;,hideTip);});
    const star=d3.symbol().type(d3.symbolStar).size(180); svg.append(&#x27;path&#x27;).attr(&#x27;d&#x27;,star()).attr(&#x27;transform&#x27;,`translate(${x(data.hit.cx)},${y(data.hit.cy)})`).attr(&#x27;fill&#x27;,colors[4]);
    svg.append(&#x27;text&#x27;).attr(&#x27;x&#x27;,x(data.hit.cx)+10).attr(&#x27;y&#x27;,y(data.hit.cy)+18).text(`击球峰值 r=${fmt1(data.hit.radius)} px`);
  }

  const draws=[drawRate,drawLag,drawTime,drawLatency,drawFunnel,drawConfidence,drawSector,drawThreshold,drawCenters];
  let queued=false; function redraw(){if(queued)return; queued=true; requestAnimationFrame(()=&gt;{queued=false; draws.forEach(fn=&gt;fn());});}
  root.querySelectorAll(&#x27;[data-series]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;{const key=button.dataset.series; confidenceVisible[key]=!confidenceVisible[key]; button.setAttribute(&#x27;aria-pressed&#x27;,String(confidenceVisible[key])); drawConfidence();}));
  new ResizeObserver(redraw).observe(root); redraw();
})();
&lt;/script&gt;

(() =&gt; {
