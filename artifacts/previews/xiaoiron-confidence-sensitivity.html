  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #xiaoiron-event-lab {
      --x-pad: clamp(14px, 2.2vw, 28px);

      background: var(--background);

    }

    #xiaoiron-event-lab .xr-title { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 14px; }
    #xiaoiron-event-lab h1 { margin: 0; font-size: clamp(20px, 2.6vw, 30px); letter-spacing: -0.02em; }
    #xiaoiron-event-lab h2 { margin: 0 0 8px; font-size: 15px; }
    #xiaoiron-event-lab p { margin: 4px 0 0; }
    #xiaoiron-event-lab .xr-muted { color: var(--muted-foreground); font-size: 12px; }
    #xiaoiron-event-lab .xr-grid { display: grid; grid-template-columns: minmax(390px, 1.08fr) minmax(330px, 0.92fr); gap: 18px; align-items: start; }
    #xiaoiron-event-lab .xr-panel { min-width: 0; }
    #xiaoiron-event-lab .xr-canvas-wrap { position: relative; width: 100%; min-height: 440px; }
    #xiaoiron-event-lab svg { display: block; width: 100%; height: auto; overflow: visible; }
    #xiaoiron-event-lab .xr-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 9px 0 11px; }
    #xiaoiron-event-lab .xr-toolbar .btn { min-height: 30px; padding: 5px 9px; font-size: 12px; }
    #xiaoiron-event-lab .xr-toolbar .btn[data-active=&quot;true&quot;] { background: var(--accent); color: var(--accent-foreground); }
    #xiaoiron-event-lab .xr-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 14px; }
    #xiaoiron-event-lab .xr-field { min-width: 0; }
    #xiaoiron-event-lab .xr-field label { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted-foreground); margin-bottom: 4px; }
    #xiaoiron-event-lab .xr-field input[type=&quot;range&quot;] { width: 100%; accent-color: var(--primary); }
    #xiaoiron-event-lab .xr-field input[type=&quot;number&quot;],
    #xiaoiron-event-lab .xr-field select { width: 100%; min-height: 30px; }
    #xiaoiron-event-lab .xr-rule { border: 0; border-top: 1px solid var(--border); margin: 13px 0; }
    #xiaoiron-event-lab .xr-metrics { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    #xiaoiron-event-lab .xr-metric { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; background: var(--card); }
    #xiaoiron-event-lab .xr-metric small { display: block; color: var(--muted-foreground); font-size: 11px; }
    #xiaoiron-event-lab .xr-metric strong { display: block; margin-top: 2px; font-size: clamp(18px, 2.6vw, 28px); font-variant-numeric: tabular-nums; }
    #xiaoiron-event-lab .xr-metric:first-child strong { color: var(--primary); }
    #xiaoiron-event-lab .xr-breakdown { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    #xiaoiron-event-lab .xr-breakdown th,
    #xiaoiron-event-lab .xr-breakdown td { padding: 6px 7px; border-bottom: 1px solid var(--border); text-align: right; }
    #xiaoiron-event-lab .xr-breakdown th:first-child,
    #xiaoiron-event-lab .xr-breakdown td:first-child { text-align: left; }
    #xiaoiron-event-lab .xr-equation { padding: 9px 10px; margin-top: 10px; background: var(--muted); border-radius: var(--radius); font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
    #xiaoiron-event-lab .xr-bottom { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; margin-top: 20px; }
    #xiaoiron-event-lab .xr-chart { min-width: 0; }
    #xiaoiron-event-lab .xr-legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 6px; font-size: 11px; color: var(--muted-foreground); }
    #xiaoiron-event-lab .xr-key { display: inline-flex; align-items: center; gap: 5px; }
    #xiaoiron-event-lab .xr-swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--swatch); }
    #xiaoiron-event-lab .xr-status { min-height: 18px; margin-top: 7px; font-size: 12px; color: var(--muted-foreground); }
    #xiaoiron-event-lab .xr-tooltip {
      position: absolute; z-index: 10; pointer-events: none; opacity: 0;
      background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 7px 9px; font-size: 11px;
      max-width: 220px; transition: opacity 80ms linear;
    }
    #xiaoiron-event-lab .xr-c0 { --swatch: var(--chart-1); }
    #xiaoiron-event-lab .xr-c1 { --swatch: var(--chart-2); }
    #xiaoiron-event-lab .xr-c2 { --swatch: var(--chart-3); }
    #xiaoiron-event-lab .xr-c3 { --swatch: var(--chart-4); }
    #xiaoiron-event-lab .xr-help { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; font-size: 11px; color: var(--muted-foreground); margin-top: 8px; }
    #xiaoiron-event-lab .xr-help b { color: var(--foreground); font-weight: 600; }
    @media (max-width: 760px) {
      #xiaoiron-event-lab .xr-grid, #xiaoiron-event-lab .xr-bottom { grid-template-columns: 1fr; }

      #xiaoiron-event-lab .xr-metric:first-child { grid-column: 1 / -1; }
    }

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;

    const panelId = selected.getAttribute(&quot;aria-controls&quot;);

      const active = tab === selected;

      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

      selectTab(tab);
      return;
    }

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

      next = (current + 1) % tabs.length;

      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
